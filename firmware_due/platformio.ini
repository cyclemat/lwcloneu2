; LWCloneU2 für Arduino Due (SAM3X8E, nativer USB-Port) / LWCloneU2 for Arduino Due (native USB port)
;
; Bauen / build:      pio run                 → .pio/build/due/firmware.bin
; Flashen / flash:    pio run -t upload       (nativer Port, 1200-Baud-Trick + bossac / native port)
; Die gemeinsamen Module (Protokoll, Konfiguration, Ausgänge, Panel, Strip) kommen aus ../firmware (shared.py).
; The shared modules (protocol, configuration, outputs, panel, strip) come from ../firmware (shared.py).

[platformio]
default_envs = due

[env:due]
platform = atmelsam@9.0.0
board = lwc_due
framework = arduino
extra_scripts = pre:shared.py
build_flags =
    -Wall
    -D LWC_BOARD_DUE
build_src_filter = +<*>
